<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trello Form</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        background: #f4f5f7;
        color: #172b4d;
      }
      #wrap {
        max-width: 560px;
        margin: 0 auto;
        padding: 24px 16px 60px;
      }
      #banner {
        border-radius: 10px 10px 0 0;
        padding: 24px 22px;
        color: white;
      }
      #banner h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      #banner p {
        margin: 0;
        opacity: 0.9;
        font-size: 14px;
      }
      #form-body {
        background: white;
        border: 1px solid #dfe1e6;
        border-top: none;
        border-radius: 0 0 10px 10px;
        padding: 22px;
      }
      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .field label .req {
        color: #ae2e24;
        font-weight: 700;
      }
      input[type="text"],
      input[type="number"],
      input[type="date"],
      input[type="email"],
      input[type="url"],
      textarea,
      select {
        width: 100%;
        padding: 9px 10px;
        border-radius: 5px;
        border: 1px solid #c1c7d0;
        font-size: 14px;
        font-family: inherit;
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      input[type="checkbox"] {
        width: auto;
        margin-right: 6px;
      }
      #submit-btn {
        width: 100%;
        border: none;
        border-radius: 6px;
        padding: 12px;
        font-size: 14px;
        font-weight: 700;
        color: white;
        cursor: pointer;
      }
      #submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      #status-msg {
        font-size: 13px;
        margin-top: 12px;
        text-align: center;
      }
      #status-msg.error {
        color: #ae2e24;
      }
      #status-msg.ok {
        color: #216e4e;
      }
      #loading,
      #success {
        text-align: center;
        padding: 60px 20px;
        font-size: 14px;
        color: #5e6c84;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="loading">Loading form&hellip;</div>
      <div id="app" style="display: none"></div>
      <div id="success" style="display: none">
        <h2 style="color: #172b4d">Thanks!</h2>
        <p>Your submission was received.</p>
      </div>
    </div>

    <script>
      function pathParts() {
        // Supports both /f/{boardId}/{formId} (via vercel.json rewrite,
        // which also forwards ?b=&f=) and direct ?b=&f= query access.
        var params = new URLSearchParams(window.location.search);
        var b = params.get("b");
        var f = params.get("f");
        if (b && f) return { boardId: b, formId: f };
        var segs = window.location.pathname.split("/").filter(Boolean);
        // e.g. ["f", "boardId", "formId"]
        if (segs.length >= 3) return { boardId: segs[1], formId: segs[2] };
        return { boardId: null, formId: null };
      }

      function escapeHtml(str) {
        return (str || "").replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }

      function inputHtml(f) {
        var reqMark = f.required ? ' <span class="req">*</span>' : "";
        var labelHtml =
          '<label for="fld_' +
          f.id +
          '">' +
          escapeHtml(f.label) +
          reqMark +
          "</label>";

        var control;
        switch (f.kind) {
          case "description":
            control =
              '<textarea id="fld_' +
              f.id +
              '" placeholder="' +
              escapeHtml(f.placeholder) +
              '"' +
              (f.required ? " required" : "") +
              "></textarea>";
            break;
          case "startdate":
          case "duedate":
            control =
              '<input type="date" id="fld_' +
              f.id +
              '"' +
              (f.required ? " required" : "") +
              ">";
            break;
          case "numbers":
            control =
              '<input type="number" id="fld_' +
              f.id +
              '" placeholder="' +
              escapeHtml(f.placeholder) +
              '"' +
              (f.required ? " required" : "") +
              ">";
            break;
          case "attachment":
            control =
              '<input type="url" id="fld_' +
              f.id +
              '" placeholder="Paste a link (image, doc, etc.)"' +
              (f.required ? " required" : "") +
              ">";
            break;
          case "dropdown":
            control =
              '<select id="fld_' +
              f.id +
              '"' +
              (f.required ? " required" : "") +
              ">" +
              '<option value="">Choose&hellip;</option>' +
              (f.options || [])
                .map(function (o) {
                  return (
                    '<option value="' +
                    escapeHtml(o) +
                    '">' +
                    escapeHtml(o) +
                    "</option>"
                  );
                })
                .join("") +
              "</select>";
            break;
          case "customfield":
            if (f.subtype === "checkbox") {
              control =
                '<label style="font-weight:400;display:flex;align-items:center;">' +
                '<input type="checkbox" id="fld_' +
                f.id +
                '"> ' +
                escapeHtml(f.placeholder || "") +
                "</label>";
            } else if (f.subtype === "date") {
              control =
                '<input type="date" id="fld_' +
                f.id +
                '"' +
                (f.required ? " required" : "") +
                ">";
            } else if (f.subtype === "email") {
              control =
                '<input type="email" id="fld_' +
                f.id +
                '"' +
                (f.required ? " required" : "") +
                ">";
            } else if (f.subtype === "rating") {
              control =
                '<select id="fld_' +
                f.id +
                '"' +
                (f.required ? " required" : "") +
                ">" +
                '<option value="">Choose&hellip;</option>' +
                [1, 2, 3, 4, 5]
                  .map(function (n) {
                    return '<option value="' + n + '">' + n + "</option>";
                  })
                  .join("") +
                "</select>";
            } else {
              control =
                '<input type="text" id="fld_' +
                f.id +
                '"' +
                (f.required ? " required" : "") +
                ">";
            }
            break;
          default: // text, title
            control =
              '<input type="text" id="fld_' +
              f.id +
              '" placeholder="' +
              escapeHtml(f.placeholder) +
              '"' +
              (f.required ? " required" : "") +
              ">";
        }

        return '<div class="field">' + labelHtml + control + "</div>";
      }

      function readValue(f) {
        var el = document.getElementById("fld_" + f.id);
        if (!el) return undefined;
        if (f.kind === "customfield" && f.subtype === "checkbox")
          return el.checked ? "Yes" : "No";
        return el.value;
      }

      var boardId, formId, formDef;

      function init() {
        var parts = pathParts();
        boardId = parts.boardId;
        formId = parts.formId;
        if (!boardId || !formId) {
          document.getElementById("loading").textContent = "Invalid form link.";
          return;
        }

        fetch(
          "/api/get-form?boardId=" +
            encodeURIComponent(boardId) +
            "&formId=" +
            encodeURIComponent(formId),
        )
          .then(function (r) {
            if (!r.ok)
              return r.json().then(function (e) {
                throw new Error(e.error || "Form not found");
              });
            return r.json();
          })
          .then(function (data) {
            formDef = data;
            render();
          })
          .catch(function (err) {
            document.getElementById("loading").textContent = err.message;
          });
      }

      function render() {
        document.getElementById("loading").style.display = "none";
        var app = document.getElementById("app");
        app.style.display = "block";

        var theme = formDef.theme || "#0079BF";
        app.innerHTML =
          '<div id="banner" style="background:' +
          theme +
          '">' +
          "<h1>" +
          escapeHtml(formDef.title || "Form") +
          "</h1>" +
          (formDef.description
            ? "<p>" + escapeHtml(formDef.description) + "</p>"
            : "") +
          "</div>" +
          '<div id="form-body">' +
          formDef.fields.map(inputHtml).join("") +
          '<button id="submit-btn" style="background:' +
          theme +
          '">Submit</button>' +
          '<div id="status-msg"></div>' +
          "</div>";

        document.getElementById("submit-btn").addEventListener("click", submit);
      }

      function submit() {
        var statusEl = document.getElementById("status-msg");
        statusEl.className = "";
        statusEl.textContent = "";

        var values = {};
        var missing = [];
        formDef.fields.forEach(function (f) {
          var v = readValue(f);
          values[f.id] = v;
          if (f.required && (v === undefined || String(v).trim() === ""))
            missing.push(f.label);
        });
        if (missing.length) {
          statusEl.className = "error";
          statusEl.textContent = "Please fill in: " + missing.join(", ");
          return;
        }

        var btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.textContent = "Submitting…";

        fetch(
          "/api/submit-form?boardId=" +
            encodeURIComponent(boardId) +
            "&formId=" +
            encodeURIComponent(formId),
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ values: values }),
          },
        )
          .then(function (r) {
            return r.json().then(function (data) {
              return { ok: r.ok, data: data };
            });
          })
          .then(function (result) {
            if (!result.ok)
              throw new Error(result.data.error || "Submission failed");
            document.getElementById("app").style.display = "none";
            document.getElementById("success").style.display = "block";
          })
          .catch(function (err) {
            statusEl.className = "error";
            statusEl.textContent = err.message;
            btn.disabled = false;
            btn.textContent = "Submit";
          });
      }

      init();
    </script>
  </body>
</html>
