<!doctype html>
<html>
  <head>
    <script src="https://p.trellocdn.com/power-up.min.js"></script>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        background: #22272b;
        color: #e8eaed;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 4px;
        text-align: center;
        font-weight: 600;
      }
      p.sub {
        font-size: 12px;
        color: #9fadbc;
        text-align: center;
        margin: 0 0 18px;
      }
      .menu-btn {
        display: block;
        width: 100%;
        background: transparent;
        color: #e8eaed;
        border: 1px solid #5a6570;
        border-radius: 6px;
        padding: 12px;
        font-size: 14px;
        margin-bottom: 10px;
        cursor: pointer;
        text-align: center;
      }
      .menu-btn:hover {
        border-color: #8c9bab;
        background: #2c333a;
      }
      .primary-btn {
        display: block;
        width: 100%;
        background: #0079bf;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 10px;
        font-size: 14px;
        cursor: pointer;
        margin-top: 6px;
      }
      .primary-btn:hover {
        background: #026aa7;
      }
      .primary-btn:disabled {
        background: #3b4b5c;
        cursor: not-allowed;
      }
      .secondary-btn {
        display: block;
        width: 100%;
        background: transparent;
        color: #9fadbc;
        border: 1px solid #5a6570;
        border-radius: 6px;
        padding: 10px;
        font-size: 13px;
        cursor: pointer;
        margin-top: 6px;
      }
      .danger-btn {
        background: transparent;
        color: #f87168;
        border: 1px solid #f87168;
        border-radius: 6px;
        padding: 8px;
        font-size: 12px;
        cursor: pointer;
        width: 100%;
        margin-top: 10px;
      }
      input[type="text"],
      select,
      textarea {
        width: 100%;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #5a6570;
        background: #1d2125;
        color: #e8eaed;
        font-size: 13px;
        margin-bottom: 10px;
      }
      label.field-label {
        font-size: 11px;
        color: #9fadbc;
        display: block;
        margin-bottom: 4px;
      }
      .field-row {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        margin-bottom: 8px;
      }
      .field-row input[type="text"] {
        margin-bottom: 0;
        flex: 1;
      }
      .field-row select {
        margin-bottom: 0;
        width: 100px;
        flex-shrink: 0;
      }
      .remove-field {
        background: transparent;
        border: 1px solid #5a6570;
        color: #9fadbc;
        border-radius: 4px;
        width: 30px;
        height: 34px;
        cursor: pointer;
        flex-shrink: 0;
      }
      .list-item {
        border: 1px solid #5a6570;
        border-radius: 6px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .list-item:hover {
        background: #2c333a;
      }
      .list-item .title {
        font-size: 13px;
        font-weight: 600;
      }
      .list-item .meta {
        font-size: 11px;
        color: #9fadbc;
        margin-top: 2px;
      }
      .empty-state {
        font-size: 12px;
        color: #9fadbc;
        text-align: center;
        padding: 20px 0;
      }
      .field-view {
        border: 1px solid #3b444c;
        border-radius: 4px;
        padding: 8px 10px;
        margin-bottom: 6px;
        font-size: 12px;
      }
      .field-view .ftype {
        color: #9fadbc;
        font-size: 10px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="content"></div>

    <script>
      var t = window.TrelloPowerUp.iframe({
        appKey: "6877c9596f69f38cce3d590e396b815f", // from https://trello.com/power-ups/admin → your Power-Up → API Key tab
        appName: "Quick Forms",
        appAuthor: "Explified",
      });
      var state = { view: "loading", forms: [], editingFormId: null };

      function uid() {
        return "f_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      }

      function loadForms() {
        return t.get("board", "shared", "quickForms", []);
      }

      function saveForms(forms) {
        state.forms = forms;
        return t.set("board", "shared", "quickForms", forms);
      }

      function resize() {
        requestAnimationFrame(function () {
          var el = document.getElementById("content");
          var height = el.offsetHeight + 40; // +40 = body's 20px top/bottom padding
          t.sizeTo(height);
        });
      }

      function goto(view, opts) {
        state.view = view;
        if (opts) Object.assign(state, opts);
        render();
      }

      function openFormBuilder(formId) {
        t.modal({
          url: "./form-builder.html",
          fullscreen: true,
          accentColor: "blue",
          title: "Quick Forms \u2014 Form Builder",
          args: { formId: formId || "" },
          callback: function () {
            // runs when the modal is closed; refresh state from storage
            loadForms().then(function (forms) {
              state.forms = forms || [];
              goto("menu");
            });
          },
        });
      }

      function openFormsList() {
        t.modal({
          url: "./forms-list.html",
          fullscreen: true,
          title: "Forms",
          callback: function () {
            // runs when the modal is closed; refresh state from storage
            loadForms().then(function (forms) {
              state.forms = forms || [];
              goto("menu");
            });
          },
        });
      }

      // ---------- Views ----------

      function renderAuthorize() {
        document.getElementById("content").innerHTML =
          "<h2>Authorize Quick Forms</h2>" +
          '<p class="sub">To get started, authorize this Power-Up with Trello.</p>' +
          '<button class="primary-btn" id="authorize-btn">Authorize Quick Forms</button>';

        document
          .getElementById("authorize-btn")
          .addEventListener("click", function () {
            t.getRestApi()
              .authorize({ scope: "read,write", expiration: "never" })
              .then(function () {
                return t.getRestApi().isAuthorized();
              })
              .then(function (isAuthorized) {
                if (isAuthorized) init();
              })
              .catch(function (err) {
                console.error("Authorization failed", err);
              });
          });
        resize();
      }

      function renderMenu() {
        document.getElementById("content").innerHTML =
          "<h2>Quick Form</h2>" +
          '<button class="menu-btn" id="btn-create">+ Create Form</button>';

        document
          .getElementById("btn-create")
          .addEventListener("click", function () {
            openFormsList();
          });
        resize();
      }

      function render() {
        if (state.view === "authorize") renderAuthorize();
        else if (state.view === "menu") renderMenu();
      }

      function escapeHtml(str) {
        return (str || "").replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      function escapeAttr(str) {
        return escapeHtml(str);
      }

      function init() {
        t.getRestApi()
          .isAuthorized()
          .then(function (isAuthorized) {
            if (!isAuthorized) {
              goto("authorize");
              return;
            }
            loadForms().then(function (forms) {
              state.forms = forms || [];
              goto("menu");
            });
          });
      }

      init();
    </script>
  </body>
</html>
